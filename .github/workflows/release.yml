name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out version
        shell: pwsh
        run: |
          # the version lives in om_video_studio.py (VERSION = "1.1.0"); bump it to publish a new release
          $v = (Select-String -Path om_video_studio.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          # chocolatey's community feed is flaky; retry a few times before giving up
          for ($i = 1; $i -le 4; $i++) {
            choco install ffmpeg innosetup -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco attempt $i failed, retrying..."
            Start-Sleep -Seconds (10 * $i)
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Quick self-test of the engine
        run: python om_video_studio.py --selftest trim,split,convert,compress,extract,thumb,extras

      - name: Build app with PyInstaller
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name OM-Video-Studio --icon app.ico
          --add-data "app.ico;." --add-data "Resource;Resource"
          --collect-all sv_ttk --collect-all tkinterdnd2 --collect-all pywinstyles --collect-all certifi om_video_studio.py

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\setup.iss
          Compress-Archive -Path dist\OM-Video-Studio\* -DestinationPath Output\OM-Video-Studio-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OM-Video-Studio
          path: Output/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: O.M. Video Studio ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            Output/OM-Video-Studio-Setup.exe
            Output/OM-Video-Studio-Portable.zip
          generate_release_notes: true
