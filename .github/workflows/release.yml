name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0-dev" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          choco install ffmpeg innosetup -y --no-progress

      - name: Quick self-test of the engine
        run: python ffmpeg_studio.py --selftest trim,split,convert,compress,extract,thumb

      - name: Build app with PyInstaller
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name OM-FFmpeg-Studio --icon app.ico
          --add-data "app.ico;." --add-data "Resource;Resource"
          --collect-all sv_ttk --collect-all tkinterdnd2 --collect-all pywinstyles ffmpeg_studio.py

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\setup.iss
          Compress-Archive -Path dist\OM-FFmpeg-Studio\* -DestinationPath Output\OM-FFmpeg-Studio-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OM-FFmpeg-Studio
          path: Output/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/OM-FFmpeg-Studio-Setup.exe
            Output/OM-FFmpeg-Studio-Portable.zip
          generate_release_notes: true
